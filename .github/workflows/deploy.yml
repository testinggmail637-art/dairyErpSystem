name: Deploy to Hostinger

# Manual deploy: GitHub → Actions → "Deploy to Hostinger" → Run workflow.
# For auto-deploy on every merge to main, uncomment the two "push" lines.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/domains/yashadhyaorganicdairyfarm.com/public_html"

          if [ ! -f .env ]; then
            echo "::error::.env not found on the server. Create it once over SSH (docs/DEPLOYMENT.md section 11)."
            exit 1
          fi
          if [ ! -d .git ]; then
            echo "::error::public_html is not a git checkout. Clone the repo there once (docs/DEPLOYMENT.md section 11)."
            exit 1
          fi

          php artisan down --retry=60 || true
          trap 'php artisan up || true' EXIT   # site comes back up even if a step fails

          # .env, storage/ and public/uploads/ are git-ignored, so reset never touches them.
          git fetch --prune origin main
          git reset --hard origin/main

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan package:discover --ansi   # composer's post-autoload-dump no longer runs it
          php artisan migrate --force
          php artisan optimize:clear
          php artisan optimize
          echo "Deployed commit $(git rev-parse --short HEAD)"
          REMOTE
